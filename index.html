<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEKETS ❤️</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-messaging-compat.js"></script>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="heart">❤️</div>

        <div>
            <h1>PEKETS</h1>
            <p>Tu asistente personal</p>
        </div>
    </div>

    <div class="welcome">
        💕
        <div>
            <strong>Hola, PEKETS ❤️</strong>
            <br>
            ¿Qué necesitas? Estoy aquí para ayudarte.
        </div>
    </div>

    <div class="options">

        <button onclick="sendRequest('Tengo hambre')">
            🍔
            <span>Tengo hambre</span>
        </button>

        <button onclick="sendRequest('Tengo la regla')">
            💧
            <span>Tengo la regla</span>
        </button>

        <button onclick="sendRequest('Necesito cuidados')">
            🙋
            <span>Necesito cuidados</span>
        </button>

        <button onclick="sendRequest('Necesito mimos')">
            ❤️
            <span>Necesito mimos</span>
        </button>

    </div>

    <!-- NOTIFICACIONES -->

    <button onclick="activarNotificaciones()" class="notification-button">
        🔔 Activar notificaciones
    </button>

    <div id="chat"></div>

    <div class="input-area">
        <input
            id="messageInput"
            type="text"
            placeholder="Escribe lo que necesitas..."
            onkeydown="handleEnter(event)"
        >

        <button onclick="sendMessage()" class="send-button">
            ➤
        </button>
    </div>

</div>

<script type="module" src="ai.js"></script>

<script type="module" src="script.js"></script>

</body>
</html>
