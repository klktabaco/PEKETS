<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PEKETS ❤️</title>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- FIREBASE PARA NOTIFICACIONES -->

    <script src="https://cdn.jsdelivr.net/npm/firebase@12.16.0/firebase-app-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/firebase@12.16.0/firebase-messaging-compat.js"></script>

</head>


<body>


<div class="app">


    <!-- CABECERA -->

    <div class="header">

        <div class="heart">
            ❤️
        </div>

        <div>

            <h1>PEKETS</h1>

            <p>
                Tu asistente personal
            </p>

        </div>

    </div>


    <!-- BIENVENIDA -->

    <div class="welcome">

        💕

        <div>

            <strong>
                Hola, PEKETS ❤️
            </strong>

            <br>

            ¿Qué necesitas?
            Estoy aquí para ayudarte.

        </div>

    </div>


    <!-- BOTONES -->

    <div class="options">


        <button
            onclick="sendRequest('Tengo hambre')"
        >

            🍔

            <span>
                Tengo hambre
            </span>

        </button>


        <button
            onclick="sendRequest('Tengo la regla')"
        >

            💧

            <span>
                Tengo la regla
            </span>

        </button>


        <button
            onclick="sendRequest('Necesito cuidados')"
        >

            🙋

            <span>
                Necesito cuidados
            </span>

        </button>


        <button
            onclick="sendRequest('Necesito mimos')"
        >

            ❤️

            <span>
                Necesito mimos
            </span>

        </button>


    </div>


    <!-- NOTIFICACIONES -->

    <button
        onclick="activarNotificaciones()"
        class="notification-button"
    >

        🔔 Activar notificaciones

    </button>


    <!-- CHAT -->

    <div id="chat"></div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Escribe lo que necesitas..."
            onkeydown="handleEnter(event)"
        >


        <button
            onclick="sendMessage()"
            class="send-button"
        >

            ➤

        </button>

    </div>


</div>


<!-- PEKETS AI -->

<script
    type="module"
    src="ai.js?v=4"
></script>


</body>

</html>
